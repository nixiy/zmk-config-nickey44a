#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# USB is only used by the right central.
CONFIG_ZMK_USB=n

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
